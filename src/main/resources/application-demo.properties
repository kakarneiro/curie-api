# Perfil DEMO: banco H2 em memoria, em modo de compatibilidade Oracle.
# Usado apenas para demonstrar a API em container/nuvem quando o Oracle da FIAP
# nao estiver acessivel. Ative com SPRING_PROFILES_ACTIVE=demo.
spring.datasource.url=jdbc:h2:mem:curie;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/data-demo.sql
spring.h2.console.enabled=true
spring.h2.console.path=/h2
