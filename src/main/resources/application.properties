spring.application.name=curie-api
server.port=8080

# ---- Oracle (FIAP) -------------------------------------------------------
# As credenciais NUNCA ficam no repositorio. Duas formas de informar:
#  1) variaveis de ambiente ORACLE_USER e ORACLE_PASSWORD; ou
#  2) arquivo src/main/resources/application-local.properties (ignorado pelo git)
#     com spring.datasource.username e spring.datasource.password.
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${ORACLE_USER:}
spring.datasource.password=${ORACLE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Perfil "local" carrega o application-local.properties quando ele existir
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ---- JPA -------------------------------------------------------------------
# As tabelas sao criadas pelo script db/CURIE_Challenge_1Sem_2TDS_BD.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Swagger / OpenAPI -----------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs

# ---- Erros -----------------------------------------------------------------
server.error.include-message=never
server.error.include-stacktrace=never